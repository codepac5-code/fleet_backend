; ============================================================================
;  FleetOS — Supervisor process configuration (NEW v1 system)
; ============================================================================
;  Copy to /etc/supervisor/conf.d/fleetos.conf, edit the 3 placeholders:
;     {{APP_PATH}}  → absolute project root (e.g. /var/www/fleetos)
;     {{APP_USER}}  → the PHP/web user (e.g. www-data or deploy)
;     {{LOG_PATH}}  → a writable log dir (e.g. /var/log/fleetos)  (mkdir first)
;  Then:  supervisorctl reread && supervisorctl update && supervisorctl start fleetos:*
;
;  Requires: PHP 8.2+, Node 18+, Redis, MySQL. Set REDIS_HOST/PORT, FLEET_RT_PORT
;  (default 6002) and APP_URL in .env. Point the apps' socket URL at the gateway.
; ============================================================================

; --- 1. Domain-event relay: outbox → Redis(rt:) + push notifications (per shard) ---
[program:fleetos-events-relay]
process_name=%(program_name)s
command=php {{APP_PATH}}/artisan fleet:events-relay --daemon --sleep=2
directory={{APP_PATH}}
autostart=true
autorestart=true
user={{APP_USER}}
redirect_stderr=true
stdout_logfile={{LOG_PATH}}/events-relay.log
stopwaitsecs=15

; --- 2. Dispatch tick: expire stale offers + advance offer waves (per shard) ---
[program:fleetos-dispatch-tick]
process_name=%(program_name)s
command=php {{APP_PATH}}/artisan fleet:dispatch-tick --daemon --sleep=3
directory={{APP_PATH}}
autostart=true
autorestart=true
user={{APP_USER}}
redirect_stderr=true
stdout_logfile={{LOG_PATH}}/dispatch-tick.log
stopwaitsecs=15

; --- 3. Scheduled-ride activation: hold + dispatch ~2h before pickup (per shard) ---
[program:fleetos-activate-scheduled]
process_name=%(program_name)s
command=php {{APP_PATH}}/artisan fleet:activate-scheduled --daemon --sleep=60 --lead=7200
directory={{APP_PATH}}
autostart=true
autorestart=true
user={{APP_USER}}
redirect_stderr=true
stdout_logfile={{LOG_PATH}}/activate-scheduled.log
stopwaitsecs=70

; --- 4. Queue worker: ShouldQueue jobs (dispatch/reminders/mail) ---
;  QUEUE_CONNECTION=database by default; switch to redis for throughput.
;  Raise numprocs for more parallelism. stopwaitsecs > longest job.
[program:fleetos-queue]
process_name=%(program_name)s_%(process_num)02d
command=php {{APP_PATH}}/artisan queue:work --sleep=3 --tries=3 --max-time=3600
directory={{APP_PATH}}
autostart=true
autorestart=true
user={{APP_USER}}
numprocs=2
redirect_stderr=true
stdout_logfile={{LOG_PATH}}/queue.log
stopwaitsecs=3600

; --- 5. Realtime gateway (Node socket server the mobile apps connect to) ---
;  Listens on FLEET_RT_PORT (default 6002); psubscribes Redis rt:*.
;  Run `npm install` in {{APP_PATH}}/realtime-gateway first.
[program:fleetos-realtime-gateway]
process_name=%(program_name)s
command=node {{APP_PATH}}/realtime-gateway/server.js
directory={{APP_PATH}}/realtime-gateway
autostart=true
autorestart=true
user={{APP_USER}}
environment=FLEET_RT_PORT="6002",REDIS_HOST="127.0.0.1",REDIS_PORT="6379",APP_URL="https://api.fleetos.app"
redirect_stderr=true
stdout_logfile={{LOG_PATH}}/realtime-gateway.log
stopwaitsecs=10

; --- Group: manage all together (supervisorctl start/stop/restart fleetos:*) ---
[group:fleetos]
programs=fleetos-events-relay,fleetos-dispatch-tick,fleetos-activate-scheduled,fleetos-queue,fleetos-realtime-gateway
