<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fleet Ride — UI Screens</title>
<style>
  :root{
    --bg:#f4f4f6; --panel:#ffffff; --ink:#14102b; --muted:#6b6880;
    --line:#e6e4ee; --brand:#5b3df5; --brand-ink:#fff; --chip:#efeef5;
    --shadow:0 6px 24px rgba(20,16,43,.10); --shadow-lg:0 24px 60px rgba(20,16,43,.35);
  }
  @media (prefers-color-scheme:dark){
    :root{ --bg:#0e0b1e; --panel:#171331; --ink:#f2f0fb; --muted:#a7a2c4;
      --line:#2a2450; --chip:#221d45; --shadow:0 6px 24px rgba(0,0,0,.4); }
  }
  :root[data-theme="dark"]{ --bg:#0e0b1e; --panel:#171331; --ink:#f2f0fb; --muted:#a7a2c4; --line:#2a2450; --chip:#221d45; }
  :root[data-theme="light"]{ --bg:#f4f4f6; --panel:#fff; --ink:#14102b; --muted:#6b6880; --line:#e6e4ee; --chip:#efeef5; }

  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased}

  header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 82%,transparent);
    backdrop-filter:saturate(180%) blur(12px);border-bottom:1px solid var(--line)}
  .bar{max-width:1240px;margin:0 auto;padding:16px 20px;display:flex;flex-wrap:wrap;gap:14px;align-items:center}
  .title{display:flex;flex-direction:column;gap:2px;margin-right:auto}
  .title h1{margin:0;font-size:19px;letter-spacing:-.02em}
  .title span{font-size:12.5px;color:var(--muted)}
  .count{font-variant-numeric:tabular-nums}

  .controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;width:100%}
  .search{flex:1;min-width:180px;display:flex;align-items:center;gap:8px;background:var(--panel);
    border:1px solid var(--line);border-radius:11px;padding:9px 12px}
  .search input{border:0;outline:0;background:transparent;color:var(--ink);font-size:14px;width:100%}
  .search svg{flex:none;opacity:.5}
  .seg{display:flex;background:var(--chip);border-radius:10px;padding:3px}
  .seg button{border:0;background:transparent;color:var(--muted);font-size:13px;font-weight:600;
    padding:7px 12px;border-radius:8px;cursor:pointer}
  .seg button.on{background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}

  nav.flows{max-width:1240px;margin:0 auto;padding:10px 20px 0;display:flex;flex-wrap:wrap;gap:7px}
  .flow-chip{border:1px solid var(--line);background:var(--panel);color:var(--muted);
    font-size:12.5px;font-weight:600;padding:6px 11px;border-radius:999px;cursor:pointer;white-space:nowrap}
  .flow-chip.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
  .flow-chip b{font-variant-numeric:tabular-nums;opacity:.7;font-weight:700;margin-left:4px}

  main{max-width:1240px;margin:0 auto;padding:8px 20px 80px}
  section{margin-top:26px}
  .sec-head{display:flex;align-items:baseline;gap:10px;margin:0 2px 12px;
    position:sticky;top:64px}
  .sec-head h2{margin:0;font-size:14px;letter-spacing:.02em;text-transform:uppercase;color:var(--muted)}
  .sec-head i{flex:1;height:1px;background:var(--line)}
  .sec-head em{font-style:normal;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(174px,1fr));gap:18px}
  .card{background:transparent;border:0;padding:0;cursor:pointer;text-align:left;font:inherit;color:inherit}
  .frame{position:relative;border-radius:22px;overflow:hidden;background:#000;
    box-shadow:var(--shadow);border:1px solid var(--line);aspect-ratio:390/844;
    transition:transform .16s ease, box-shadow .16s ease}
  .card:hover .frame{transform:translateY(-4px);box-shadow:var(--shadow-lg)}
  .frame img{width:100%;height:100%;object-fit:cover;display:block}
  .badge{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.55);color:#fff;
    font-size:10.5px;font-weight:700;padding:3px 7px;border-radius:6px;letter-spacing:.02em;backdrop-filter:blur(4px)}
  .ar-tag{position:absolute;top:8px;right:8px;background:var(--brand);color:#fff;
    font-size:10px;font-weight:800;padding:3px 6px;border-radius:6px}
  .cap{display:flex;flex-direction:column;gap:1px;padding:9px 3px 0}
  .cap b{font-size:13px;font-weight:600;letter-spacing:-.01em}
  .cap span{font-size:11.5px;color:var(--muted)}
  .empty{color:var(--muted);text-align:center;padding:60px 0;font-size:14px}

  /* lightbox */
  .lb{position:fixed;inset:0;z-index:50;display:none;place-items:center;
    background:rgba(8,6,20,.82);backdrop-filter:blur(6px);padding:24px}
  .lb.on{display:grid}
  .lb figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:14px;max-height:100%}
  .lb img{max-height:78vh;max-width:min(92vw,420px);border-radius:26px;
    box-shadow:var(--shadow-lg);border:1px solid rgba(255,255,255,.12)}
  .lb figcaption{color:#fff;text-align:center;font-size:14px}
  .lb figcaption b{display:block;font-size:16px;margin-bottom:2px}
  .lb figcaption span{opacity:.6;font-size:12.5px}
  .lb .x{position:absolute;top:18px;right:20px;width:42px;height:42px;border-radius:50%;
    border:0;background:rgba(255,255,255,.12);color:#fff;font-size:20px;cursor:pointer}
  .lb .arw{position:absolute;top:50%;transform:translateY(-50%);width:50px;height:50px;border-radius:50%;
    border:0;background:rgba(255,255,255,.12);color:#fff;font-size:24px;cursor:pointer;display:grid;place-items:center}
  .lb .prev{left:18px} .lb .next{right:18px}
  .lb .arw:hover,.lb .x:hover{background:rgba(255,255,255,.24)}
  @media (max-width:560px){ .lb .arw{width:42px;height:42px} }
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="title">
      <h1>Fleet Ride — UI Screens</h1>
      <span><span class="count" id="count">63</span> screens · rider app · tap any screen to zoom</span>
    </div>
    <div class="seg" id="lang">
      <button data-lang="all" class="on">All</button>
      <button data-lang="en">EN</button>
      <button data-lang="ar">عربي</button>
    </div>
    <div class="seg" id="theme">
      <button data-theme="auto" class="on">Auto</button>
      <button data-theme="light">Light</button>
      <button data-theme="dark">Dark</button>
    </div>
  </div>
  <div class="bar" style="padding-top:0">
    <div class="controls">
      <label class="search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="q" type="search" placeholder="Search screens…  (e.g. wallet, rating, arriving)" autocomplete="off">
      </label>
    </div>
  </div>
  <nav class="flows" id="flows"></nav>
</header>

<main id="main"></main>

<div class="lb" id="lb" role="dialog" aria-modal="true">
  <button class="x" id="lbClose" aria-label="Close">✕</button>
  <button class="arw prev" id="lbPrev" aria-label="Previous">‹</button>
  <figure>
    <img id="lbImg" alt="">
    <figcaption><b id="lbTitle"></b><span id="lbMeta"></span></figcaption>
  </figure>
  <button class="arw next" id="lbNext" aria-label="Next">›</button>
</div>

<script>
const DIR = 'screens/';
// [file, title, flow, lang]
const S = [
  ['01-splash','Splash','Entry','en'],
  ['03-login','Login · OTP','Entry','en'],
  ['37-onboarding','Onboarding','Entry','en'],
  ['38-register','Register','Entry','en'],
  ['38b-country-picker','Country picker','Entry','en'],
  ['35a-location','Location priming','Entry','en'],
  ['35b-notifications','Notification priming','Entry','en'],

  ['04-home','Home','Booking','en'],
  ['05-route','Route & availability','Booking','en'],
  ['06-class','Class select','Booking','en'],
  ['07-office','Office select','Booking','en'],
  ['28-schedule','Schedule','Booking','en'],
  ['28b-datetime','Date / time sheet','Booking','en'],

  ['09-matching','Matching','Live trip','en'],
  ['10-accepted','Driver accepted','Live trip','en'],
  ['11-arriving','Arriving','Live trip','en'],
  ['12-arrived','Arrived','Live trip','en'],
  ['13-in-ride','In-ride · meter','Live trip','en'],
  ['14-safety','Safety sheet','Live trip','en'],

  ['15-completed','Completed','Post-trip','en'],
  ['16-rating','Rating','Post-trip','en'],
  ['17-receipt','Receipt','Post-trip','en'],
  ['33-lost-item','Lost item','Post-trip','en'],

  ['18-trips','Trips history','Account','en'],
  ['19-favorites','Favorites','Account','en'],
  ['20-office-profile','Office profile','Account','en'],
  ['21-wallet','Wallet','Account','en'],
  ['22-profile','Profile','Account','en'],
  ['23-support','Support','Account','en'],
  ['26-edit-profile','Edit profile','Account','en'],
  ['27-payments','Payment methods','Account','en'],
  ['28-add-card','Add card','Account','en'],
  ['29-topup','Top-up','Account','en'],
  ['29b-history','Wallet history','Account','en'],
  ['29c-promo','Promo codes','Account','en'],
  ['30-notifications','Notifications','Account','en'],
  ['31-places','Saved places','Account','en'],
  ['36-help-article','Help article','Account','en'],

  ['45-safety-contacts','Safety contacts','Settings','en'],
  ['46-privacy','Privacy','Settings','en'],
  ['47-change-phone','Change phone','Settings','en'],
  ['48-place-edit','Saved place edit','Settings','en'],
  ['49-set-pickup','Set pickup','Settings','en'],
  ['50-complaint','Complaint','Settings','en'],
  ['51-invoices','Invoices','Settings','en'],
  ['52-family-members','Family members','Settings','en'],

  ['24a-scheduled-details','Scheduled details','Scheduled / B2B','en'],
  ['24b-fixed-offers','Fixed offers','Scheduled / B2B','en'],
  ['24c-scheduled-status','Scheduled status','Scheduled / B2B','en'],
  ['25a-corporate','Corporate','Scheduled / B2B','en'],
  ['25b-family','Family','Scheduled / B2B','en'],

  ['S1-no-offices','No offices','States','en'],
  ['S2-office-rejected','Office rejected','States','en'],
  ['S3-payment-recovery','Payment recovery','States','en'],
  ['S4-offline','Offline','States','en'],
  ['S5-location-denied','Location denied','States','en'],
  ['S6-arabic-home','Arabic home','States','ar'],
  ['S7-empty-trips','Empty trips','States','en'],

  ['04-home-ar','Home','Arabic RTL','ar'],
  ['05-route-ar','Route & availability','Arabic RTL','ar'],
  ['07-office-ar','Office select','Arabic RTL','ar'],
  ['11-arriving-ar','Arriving','Arabic RTL','ar'],
  ['16-rating-ar','Rating','Arabic RTL','ar'],
];
const FLOWS = ['Entry','Booking','Live trip','Post-trip','Account','Settings','Scheduled / B2B','States','Arabic RTL'];

const state = { q:'', lang:'all', flow:'all' };
let visible = [];

const main = document.getElementById('main');
const flowsNav = document.getElementById('flows');
const countEl = document.getElementById('count');

function match(s){
  if(state.lang!=='all' && s[3]!==state.lang) return false;
  if(state.flow!=='all' && s[2]!==state.flow) return false;
  if(state.q){
    const t=(s[0]+' '+s[1]+' '+s[2]).toLowerCase();
    if(!t.includes(state.q)) return false;
  }
  return true;
}

function render(){
  visible = S.filter(match);
  countEl.textContent = visible.length;
  main.innerHTML='';
  if(!visible.length){ main.innerHTML='<p class="empty">No screens match “'+state.q+'”.</p>'; return; }
  for(const flow of FLOWS){
    const items = visible.filter(s=>s[2]===flow);
    if(!items.length) continue;
    const sec=document.createElement('section');
    sec.innerHTML='<div class="sec-head"><h2>'+flow+'</h2><i></i><em>'+items.length+'</em></div>';
    const grid=document.createElement('div'); grid.className='grid';
    for(const s of items){
      const gi = visible.indexOf(s);
      const isAr = s[3]==='ar';
      const b=document.createElement('button'); b.className='card'; b.dataset.i=gi;
      b.innerHTML =
        '<div class="frame"><span class="badge">'+s[0].split('-')[0].toUpperCase()+'</span>'+
        (isAr?'<span class="ar-tag">عربي</span>':'')+
        '<img loading="lazy" src="'+DIR+s[0]+'.png" alt="'+s[1]+'"></div>'+
        '<div class="cap"><b>'+s[1]+'</b><span>'+s[0]+'.png</span></div>';
      grid.appendChild(b);
    }
    sec.appendChild(grid); main.appendChild(sec);
  }
}

// flow chips
flowsNav.innerHTML = ['all',...FLOWS].map(f=>{
  const n = f==='all'? S.length : S.filter(s=>s[2]===f).length;
  return '<button class="flow-chip'+(f==='all'?' on':'')+'" data-flow="'+f+'">'+
    (f==='all'?'All':f)+'<b>'+n+'</b></button>';
}).join('');
flowsNav.addEventListener('click',e=>{
  const b=e.target.closest('.flow-chip'); if(!b)return;
  state.flow=b.dataset.flow;
  flowsNav.querySelectorAll('.flow-chip').forEach(c=>c.classList.toggle('on',c===b));
  render();
});

document.getElementById('q').addEventListener('input',e=>{ state.q=e.target.value.trim().toLowerCase(); render(); });
document.getElementById('lang').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b)return; state.lang=b.dataset.lang;
  e.currentTarget.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b)); render();
});
document.getElementById('theme').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b)return;
  const t=b.dataset.theme;
  if(t==='auto') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme',t);
  e.currentTarget.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));
});

// lightbox
const lb=document.getElementById('lb'), lbImg=document.getElementById('lbImg'),
  lbTitle=document.getElementById('lbTitle'), lbMeta=document.getElementById('lbMeta');
let cur=-1;
function open(i){ cur=i; const s=visible[i]; if(!s)return;
  lbImg.src=DIR+s[0]+'.png'; lbImg.alt=s[1];
  lbTitle.textContent=s[1]+(s[3]==='ar'?'  ·  عربي':'');
  lbMeta.textContent=s[2]+'  ·  '+s[0]+'.png  ·  '+(i+1)+' / '+visible.length;
  lb.classList.add('on');
}
function close(){ lb.classList.remove('on'); cur=-1; }
function step(d){ if(cur<0)return; open((cur+d+visible.length)%visible.length); }
main.addEventListener('click',e=>{ const c=e.target.closest('.card'); if(c) open(+c.dataset.i); });
document.getElementById('lbClose').onclick=close;
document.getElementById('lbPrev').onclick=()=>step(-1);
document.getElementById('lbNext').onclick=()=>step(1);
lb.addEventListener('click',e=>{ if(e.target===lb) close(); });
document.addEventListener('keydown',e=>{
  if(!lb.classList.contains('on'))return;
  if(e.key==='Escape')close(); else if(e.key==='ArrowRight')step(1); else if(e.key==='ArrowLeft')step(-1);
});

render();
</script>
</body>
</html>
