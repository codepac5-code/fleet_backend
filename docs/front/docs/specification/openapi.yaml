openapi: 3.0.3
info:
  title: FleetOS DriverX API
  version: 2.1.0
  description: |-
    Backend integration contract for the FleetOS DriverX driver app.

    Transport: REST (JSON) over HTTPS plus a Socket.IO realtime layer (documented under the top-level `x-realtime` extension, since OpenAPI cannot model sockets natively).

    Auth: phone-OTP -> Bearer token on the Laravel 'driver' guard (Sanctum). Send `Authorization: Bearer <token>` on every endpoint except the auth/* onboarding ones and driver self-registration.

    Money: NEW rider-API tables store money as INTEGER MINOR UNITS with a sibling `currency_code` (e.g. total_minor 3800 + QAR == 38.00 QAR); LEGACY tables store DECIMAL MAJOR units. Never mix.

    Units: `distance_m` is METRES (integer), `duration_s` is SECONDS (integer).

    Enums: status/kind/category columns are plain VARCHAR(16/32) agreements in code (NOT DB enums) - the DB will not reject unknown values. The agreed vocabularies are captured under `x-enums`.

    Realtime events (Socket.IO) are documented under `x-realtime`.
servers:
- url: https://api.fleetos.example/driver/v1
security:
- bearerAuth: []
tags:
- name: Auth
- name: Availability
- name: Trips
- name: Chat
- name: Scheduled
- name: Earnings/Wallet/Notifications
- name: Profile/Settings/Places/Support/Safety
x-realtime:
  transport: Socket.IO over WSS, fed by the event_outbox table. The app reduces events onto the availability + trip FSMs (lib/core/services/socket_service.dart).
  connect:
    url: wss://rt.fleetos.example
    auth:
      token: <accessToken>
      driver_id: 20498
    rooms:
    - driver:{driver_id}
    - trip:{booking_id}
    status_lifecycle:
    - disconnected
    - connecting
    - connected
  clientToServer:
  - event: driver:availability
    description: Mirror of POST /availability -> driver_presence.
    payload:
      driver_id: 20498
      status: online
      busy_reason: null
  - event: driver:presence
    description: Mirror of POST /presence.
    payload:
      driver_id: 20498
      lat: 25.2867
      lng: 51.5333
      heading: 118.5
      speedKmh: 42.0
  - event: trip:action
    description: Driver action in a trip room. action in accept|navigate|arrive|start|complete|cancel.
    payload:
      booking_id: 20498
      action: accept
  - event: chat:send
    description: Driver sends a chat message in the trip room. Server persists to booking_chat_messages and broadcasts chat:message. client_msg_id lets the sender reconcile its optimistic bubble.
    payload:
      booking_id: 20498
      body: On my way, 3 min.
      client_msg_id: c_9f2c1a
  - event: chat:read
    description: Driver marks rider messages read up to up_to_id.
    payload:
      booking_id: 20498
      up_to_id: 55201
  - event: chat:typing
    description: Ephemeral typing indicator (not persisted).
    payload:
      booking_id: 20498
      from_type: driver
      typing: true
  serverToClient:
  - event: trip:request
    description: New dispatch_offer -> incoming request (IncomingRequestEvent).
    payload:
      booking:
        id: 20498
        user_id: 88231
        office_id: 12
        driver_id: 20498
        vehicle_id: 2049
        source: dispatch
        service: ride
        service_class: comfort
        pricing_style: fixed
        status: offered
        pickup_lat: 25.2867
        pickup_lng: 51.5333
        pickup_title: Msheireb Downtown Gate 3
        pickup_note: null
        dropoff_lat: 25.321
        dropoff_lng: 51.529
        dropoff_title: West Bay Tower 18
        distance_m: 1200
        duration_s: 540
        currency_code: QAR
        fare_minor: 3800
        discount_minor: 0
        waiting_minor: 0
        tip_minor: 0
        total_minor: 3800
        held_minor: 0
        payment_method: wallet
        scheduled_at: null
        passengers: 1
        luggage: 0
        assigned_at: '2026-07-15T13:02:20Z'
        created_at: '2026-07-15T13:02:11Z'
      offer:
        id: 77123
        booking_id: 20498
        driver_id: 20498
        wave: 1
        status: offered
        distance_m: 320
        expires_at: '2026-07-15T13:02:29Z'
      countdownSeconds: 18
  - event: trip:ack
    description: Backend ack of a driver action (TripAckEvent).
    payload:
      booking_id: 20498
      action: accept
  - event: location:tick
    description: Live ETA/distance to pickup (LocationTickEvent).
    payload:
      booking_id: 20498
      etaMinutes: 3
      distance_m: 900
  - event: meter:tick
    description: Running fare while in_progress (MeterTickEvent). Minor units.
    payload:
      booking_id: 20498
      total_minor: 3250
      distance_m: 5400
      duration_s: 660
  - event: trip:status
    description: Force-sync ride_bookings.status (e.g. office/rider cancel).
    payload:
      booking_id: 20498
      status: cancelled
  - event: office:message
    description: Office broadcast -> app_notifications.
    payload:
      id: 33911
      notifiable_type: driver
      notifiable_id: 20498
      template_key: office.broadcast
      type: office
      locale: en
      title: Message from Pearl Mobility
      body: Airport queue priority this weekend.
      data:
        route: /support/office
      read_at: null
      created_at: '2026-07-15T09:12:00Z'
  - event: chat:message
    description: A new trip chat message (from rider or the driver's own echo). Maps to Flutter ChatMessageEvent.
    payload:
      message:
        id: 55201
        booking_id: 20498
        from_type: rider
        body: I'm at gate 3, silver bag.
        read_at: null
        created_at: '2026-07-15T13:06:20Z'
      client_msg_id: c_9f2c1a
  - event: chat:read
    description: The rider read the driver's messages up to up_to_id (read receipts).
    payload:
      booking_id: 20498
      reader_type: rider
      up_to_id: 55187
      read_at: '2026-07-15T13:06:40Z'
x-enums:
  _note: 'IMPORTANT: verified against docs/migrations/*. These columns are plain VARCHAR(16/32) strings — NOT database enums — so the DB will NOT reject an unknown value. The app and backend must AGREE this vocabulary in code. Each entry gives the migration''s column `default` and `maxlen` (values must fit) plus the agreed `values`.'
  ride_bookings.status:
    default: matching
    maxlen: 16
    values:
    - matching
    - offered
    - assigned
    - arrived
    - in_progress
    - completed
    - cancelled
    - no_show
    - scheduled
  ride_bookings.service_class:
    maxlen: 32
    values:
    - ride
    - standard
    - comfort
    - premium
    - luxury
  ride_bookings.pricing_style:
    maxlen: 16
    values:
    - fixed
    - meter
  ride_bookings.payment_method:
    default: wallet
    maxlen: 16
    values:
    - cash
    - wallet
    - card
  ride_bookings.source:
    default: app
    maxlen: 16
    values:
    - app
    - office
    - dispatch
    - scheduled
  driver_presence.status:
    default: offline
    maxlen: 16
    values:
    - online
    - busy
    - offline
    - on_trip
  driver_presence.busy_reason:
    maxlen: 16
    nullable: true
    values:
    - break
    - fuel
    - vehicle_check
    - prayer
    - personal
  driver_documents.status:
    default: pending
    values:
    - pending
    - verified
    - rejected
    - expired
  driver_safety_events.kind:
    maxlen: 16
    values:
    - sos
    - share_status
  driver_safety_events.category:
    maxlen: 32
    values:
    - hold
    - slide
    - manual
  driver_safety_events.status:
    default: open
    maxlen: 16
    values:
    - open
    - active
    - closed
    - cancelled
  dispatch_offers.status:
    default: offered
    maxlen: 16
    values:
    - offered
    - accepted
    - declined
    - expired
  dispatch_jobs.status:
    values:
    - open
    - waving
    - assigned
    - cancelled
    - expired
  payout_requests.status:
    default: pending
    values:
    - pending
    - processing
    - paid
    - failed
  lost_items.status:
    default: open
    maxlen: 16
    values:
    - open
    - awaiting_reply
    - resolved
    note: rider-owned table (user_id)
  lost_items.category:
    maxlen: 16
    values:
    - phone
    - wallet
    - bag
    - keys
    - other
  saved_places.label:
    default: other
    maxlen: 16
    note: free label / kind, e.g. home|work|other
  saved_places.icon:
    default: pin
    maxlen: 16
    values:
    - home
    - work
    - gem
    - heart
    - pin
  app_device_tokens.platform:
    values:
    - apns
    - fcm
    - ios
    - android
  ride_ratings.rater_type:
    values:
    - driver
    - user
  booking_chat_messages.from_type:
    maxlen: 8
    values:
    - driver
    - rider
    - office
  driver_applications.kind:
    values:
    - self
    - invited
  driver_applications.status:
    values:
    - pending
    - approved
    - rejected
  drivers.status:
    default: active
    maxlen: 16
    values:
    - pending
    - active
    - suspended
    note: column added in migration 2026_07_15_000002; registration sets 'pending', approval sets 'active'.
