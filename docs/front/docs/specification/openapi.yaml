paths:
  /auth/otp/request:
    post:
      tags:
      - Auth
      summary: Request OTP
      operationId: postAuthOtpRequest
      description: 'Error codes: INVALID_PHONE, RATE_LIMITED.'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              example:
                phone: +9745500XXXX
                purpose: login
                dialCode: '+974'
                channel: sms
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                example:
                  sent: true
                  expiresInSec: 120
                  channel: sms
        default: &id001
          description: Error envelope (non-2xx). See x-error-codes for the code list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /auth/otp/verify:
    post:
      tags:
      - Auth
      summary: Verify OTP
      operationId: postAuthOtpVerify
      description: 'Error codes: OTP_INCORRECT, OTP_EXPIRED.'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              example:
                phone: +9745500XXXX
                code: '472189'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                example:
                  accessToken: …
                  refreshToken: …
                  expiresInSec: 3600
                  accountStatus: active
                  driver:
                    id: 20498
                    firstName: John
                    lastName: Smith
                    email: john@example.com
                    userName: john.smith
                    status: active
                    phoneNumber: 5500XXXX
                    dialCode: '+974'
                    photo: null
                    gender: male
                    officeId: 12
                    vehicleId: 2049
                    isActive: true
                    isConected: true
                    is_registered: true
                    rating: 4.9
                    rideCount: 1284
                    kmCount: 20431
                    walletBalance: 640.0
        default: *id001
  /auth/token/refresh:
    post:
      tags:
      - Auth
      summary: Refresh token
      operationId: postAuthTokenRefresh
      description: 'Error codes: TOKEN_EXPIRED.'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              example:
                refreshToken: …
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                example:
                  accessToken: …
                  expiresInSec: 3600
        default: *id001
  /auth/logout:
    post:
      tags:
      - Auth
      summary: Logout
      operationId: postAuthLogout
      description: 'Error codes: UNAUTHORIZED.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              example:
                refreshToken: …
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                example:
                  ok: true
        default: *id001
  /drivers/applications:
    post:
      tags:
      - Auth
      summary: Register as driver (driver_applications)
      operationId: postDriversApplications
      description: 'Error codes: VALIDATION_FAILED, OFFICE_CODE_INVALID.'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              example:
                name: John Smith
                phone: '+97455001234'
                city: Doha, Qatar
                vehicle_type: Standard sedan
                license_number: QA-DR-10284
                office_id: 12
                invite_code: PRL-4098
                kind: invited
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverApplication'
        default: *id001
  /offices/link-requests:
    post:
      tags:
      - Auth
      summary: Link to taxi office
      operationId: postOfficesLinkRequests
      description: 'Error codes: OFFICE_CODE_INVALID.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              example:
                invite_code: PRL-4098
                office_id: 12
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                example:
                  linkRequestId: 331
                  office:
                    id: 12
                    officeName: Pearl Mobility
                    displayName: Pearl Mobility
                    contactNumber: '+97440001234'
                    status: active
                    initials: PM
                    is_verified: true
                    rating: 4.8
                    ratings_count: 172
                  status: pending
        default: *id001
  /drivers/me/onboarding:
    get:
      tags:
      - Auth
      summary: Onboarding / account status poll
      operationId: getDriversMeOnboarding
      description: 'Error codes: UNAUTHORIZED.'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                example:
                  accountStatus: pending
                  office:
                    id: 12
                    officeName: Pearl Mobility
                    linkStatus: pending
                  checklist:
                  - item: documents
                    status: verified
                  - item: office_link
                    status: pending
        default: *id001
  /drivers/me/permissions:
    patch:
      tags:
